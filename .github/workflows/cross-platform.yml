name: Cross-platform check

# Does the Rust crate still compile on macOS and Linux? Nothing here produces a
# release — it exists so the Windows-only code stays properly gated and we find
# out on push instead of guessing. Runs manually, or on changes to Rust sources.
on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/**"
      - ".github/workflows/cross-platform.yml"

jobs:
  check:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --no-default-features
