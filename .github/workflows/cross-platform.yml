name: Cross-platform check

# Does the Rust crate still compile on macOS and Linux? Nothing here produces a
# release — it exists so the Windows-only code stays properly gated and we find
# out on push instead of guessing.
on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/**"
      - ".github/workflows/cross-platform.yml"

jobs:
  check:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Stub the sidecars for this target
        shell: bash
        run: |
          # tauri_build resolves externalBin AND bundle.resources before the
          # Rust is even compiled, so every path the platform config names has
          # to exist or the build script fails with no useful message. These are
          # empty placeholders for a compile check only, never shipped.
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/sidecars/llama src-tauri/sidecars/piper src-tauri/sidecars/sherpa
          touch "src-tauri/sidecars/whisper-cpp-$TRIPLE" src-tauri/sidecars/whisper-server
          chmod +x "src-tauri/sidecars/whisper-cpp-$TRIPLE" src-tauri/sidecars/whisper-server
          # Directory resources must be non-empty to be copied.
          touch src-tauri/sidecars/llama/.keep src-tauri/sidecars/piper/.keep src-tauri/sidecars/sherpa/.keep
          find src-tauri/sidecars -maxdepth 2

      - name: cargo check
        id: check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --no-default-features --message-format=short --color=never 2>&1 | tee check.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> $GITHUB_OUTPUT
          # Exit with the real code: ending on `echo` made this step report
          # success no matter what cargo did, so the reporter below never fired
          # and a broken macOS build looked green.
          exit $CODE

      - name: Post the errors as a commit comment
        if: always() && steps.check.outputs.code != '0'
        working-directory: src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Job logs need admin rights over the API. A commit comment on a public
          # repo does not, so that is where the compile errors go.
          {
            echo "### ${{ matrix.label }} - cargo check exit ${{ steps.check.outputs.code }}"
            echo ""
            tail -60 check.log
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)"
          exit ${{ steps.check.outputs.code }}
