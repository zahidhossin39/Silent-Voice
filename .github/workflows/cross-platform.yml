name: Cross-platform check

# Does the Rust crate still compile on macOS and Linux? Nothing here produces a
# release — it exists so the Windows-only code stays properly gated and we find
# out on push instead of guessing. Runs manually, or on changes to Rust sources.
on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/**"
      - ".github/workflows/cross-platform.yml"

jobs:
  check:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --no-default-features --message-format=short 2>&1 | tee check.log
          code=${PIPESTATUS[0]}
          # Re-emit each compiler error as a workflow annotation. Job logs need
          # admin rights to read over the API; annotations do not, so this is
          # what makes the failures visible without downloading logs.
          grep -E "error(\[E[0-9]+\])?:" check.log | sort -u | head -60             | while IFS= read -r line; do echo "::error::$line"; done
          echo "### ${{ matrix.label }} — cargo check" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error(\[E[0-9]+\])?:" check.log | sort -u | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code
