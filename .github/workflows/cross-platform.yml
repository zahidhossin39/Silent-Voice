name: Cross-platform check

# Does the Rust crate still compile on macOS and Linux? Nothing here produces a
# release — it exists so the Windows-only code stays properly gated and we find
# out on push instead of guessing.
on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/**"
      - ".github/workflows/cross-platform.yml"

jobs:
  check:
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Stub the sidecar for this target
        shell: bash
        run: |
          # tauri_build refuses to build unless externalBin has a binary named
          # for the host triple. We only want to compile-check the Rust, so an
          # empty placeholder is enough. Never shipped.
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/sidecars
          touch "src-tauri/sidecars/whisper-cpp-$TRIPLE"
          chmod +x "src-tauri/sidecars/whisper-cpp-$TRIPLE"
          echo "stubbed whisper-cpp-$TRIPLE"

      - name: cargo check
        id: check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --no-default-features --message-format=short --color=never 2>&1 | tee check.log
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post the errors as a commit comment
        if: always()
        working-directory: src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Job logs need admin rights over the API. A commit comment on a public
          # repo does not, so that is where the compile errors go.
          {
            echo "### ${{ matrix.label }} - cargo check exit ${{ steps.check.outputs.code }}"
            echo ""
            grep -E "error" check.log | grep -vE "Compiling|Downloaded|Checking" | sort -u | head -40 || echo "(no error lines)"
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)"
          exit ${{ steps.check.outputs.code }}
