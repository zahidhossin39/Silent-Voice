name: Release

# Build, sign, and publish a new release + updater manifest when a version tag is pushed.
# Tag format: v0.1.4 (must match tauri.conf.json version). Push with: git tag v0.1.4 && git push origin v0.1.4
#
# All three platforms publish into the SAME draft release. The updater key is
# minisign, which is platform-independent, so one secret signs everything.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundle: nsis
          - os: macos-latest
            label: macOS
            bundle: macos
          - os: ubuntu-22.04
            label: Linux
            bundle: appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2 libxdo-dev

      - name: Install frontend deps
        run: npm ci

      # Windows sidecars are committed to the repo; the others are fetched.
      - name: Fetch sidecars
        if: runner.os != 'Windows'
        run: bash scripts/fetch-sidecars.sh

      # The Windows sidecars (.dll/.exe) are committed to the repo and the
      # resource globs copy whole folders, so without this every Linux and
      # macOS package carried ~75 MB of Windows binaries it can never run.
      - name: Drop Windows-only sidecars
        if: runner.os != 'Windows'
        shell: bash
        run: find src-tauri/sidecars -type f \( -iname '*.dll' -o -iname '*.exe' \) -print -delete

      - name: Fail if the signing secret is missing
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. Publishing now would ship a"
            echo "release with no .sig files, and every installed client would"
            echo "silently refuse the update forever."
            exit 1
          fi

      - name: Build, sign, and publish
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sidecars:${{ github.workspace }}/src-tauri/sidecars/piper:${{ github.workspace }}/src-tauri/sidecars/llama:${{ github.workspace }}/src-tauri/sidecars/sherpa
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Silent Voice ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            **Windows** — `.exe`. Existing installs update themselves.

            **macOS** (Apple Silicon) — `.dmg`. The app is not notarised yet, so Gatekeeper
            will refuse it on first launch: right-click the app and choose
            **Open**, then confirm. Silent Voice also needs Accessibility
            permission (System Settings > Privacy & Security > Accessibility)
            or the hotkey and paste do nothing.

            **Linux** — Ubuntu/Debian: `.deb`. Any other distro (Arch, Fedora…):
            `.AppImage` — `chmod +x` it and run; if it says FUSE is missing,
            install `fuse2` or run it with `--appimage-extract-and-run`.
            Arch users can also build a native package from `packaging/arch/PKGBUILD`
            in the repo (`makepkg -si`). X11 only; Wayland cannot allow
            an app to type into another app. Inline proofreading additionally
            needs `gsettings set org.gnome.desktop.interface toolkit-accessibility true`.

            macOS and Linux do not auto-update yet — check back here for builds.
          releaseDraft: true
          prerelease: false
          # ONLY Windows writes latest.json. Three matrix jobs updating the
          # same manifest concurrently is a read-modify-write race whose loser
          # vanishes from the file, and the cost of losing that race is every
          # existing Windows user silently never seeing another update.
          # macOS and Linux have no installed base yet, so they ship installers
          # to download by hand until they do.
          includeUpdaterJson: ${{ matrix.label == 'Windows' }}

      # Only the updater needs signatures, and only Windows produces them.
      - name: Verify this platform's bundle was actually signed
        if: matrix.label == 'Windows'
        shell: bash
        run: |
          # tauri build exits 0 even when signing fails, so a missing .sig is
          # otherwise published as a green build that no client can install.
          shopt -s nullglob
          sigs=(src-tauri/target/release/bundle/${{ matrix.bundle }}/*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "No .sig file for ${{ matrix.label }} - refusing to publish an unupdatable release."
            ls -R src-tauri/target/release/bundle || true
            exit 1
          fi
          echo "Signed: ${sigs[*]}"

      # tauri-action always uploads the macOS .app as "<name>_aarch64.app.tar.gz".
      # It is only an updater payload, and macOS updates are off, so nothing
      # uses it — but on the release page it reads like the Linux download.
      # Linux users grabbed it and found a Mac app. The .dmg is the installer.
      - name: Remove the confusing macOS .app.tar.gz
        if: matrix.label == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets"             --jq '.[] | select(.name | endswith(".app.tar.gz")) | .id' |
          while read -r id; do
            echo "deleting asset $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
          done
