name: Release

# Build, sign, and publish a new release + updater manifest when a version tag is pushed.
# Tag format: v0.1.4 (must match tauri.conf.json version). Push with: git tag v0.1.4 && git push origin v0.1.4
#
# All three platforms publish into the SAME draft release. The updater key is
# minisign, which is platform-independent, so one secret signs everything.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundle: nsis
          - os: macos-latest
            label: macOS
            bundle: macos
          - os: ubuntu-22.04
            label: Linux
            bundle: appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2 libxdo-dev

      - name: Install frontend deps
        run: npm ci

      # Windows sidecars are committed to the repo; the others are fetched.
      - name: Fetch sidecars
        if: runner.os != 'Windows'
        run: bash scripts/fetch-sidecars.sh

      # The Windows sidecars (.dll/.exe) are committed to the repo and the
      # resource globs copy whole folders, so without this every Linux and
      # macOS package carried ~75 MB of Windows binaries it can never run.
      - name: Drop Windows-only sidecars
        if: runner.os != 'Windows'
        shell: bash
        run: find src-tauri/sidecars -type f \( -iname '*.dll' -o -iname '*.exe' \) -print -delete

      - name: Fail if the signing secret is missing
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. Publishing now would ship a"
            echo "release with no .sig files, and every installed client would"
            echo "silently refuse the update forever."
            exit 1
          fi

      - name: Build, sign, and publish
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sidecars:${{ github.workspace }}/src-tauri/sidecars/piper:${{ github.workspace }}/src-tauri/sidecars/llama:${{ github.workspace }}/src-tauri/sidecars/sherpa
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Silent Voice ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            **Windows** — `.exe`. Existing installs update themselves.

            **macOS** (Apple Silicon) — `.dmg`. The app is not notarised yet, so Gatekeeper
            will refuse it on first launch: right-click the app and choose
            **Open**, then confirm. Silent Voice also needs Accessibility
            permission (System Settings > Privacy & Security > Accessibility)
            or the hotkey and paste do nothing.

            **Linux** — Ubuntu/Debian: `.deb`. Any other distro (Arch, Fedora…):
            `.AppImage` — `chmod +x` it and run; if it says FUSE is missing,
            install `fuse2` or run it with `--appimage-extract-and-run`.
            Arch users can also build a native package from `packaging/arch/PKGBUILD`
            in the repo (`makepkg -si`). X11 only; Wayland cannot allow
            an app to type into another app. Inline proofreading additionally
            needs `gsettings set org.gnome.desktop.interface toolkit-accessibility true`.

            All platforms update themselves (on Linux: the AppImage).
          releaseDraft: true
          prerelease: false
          # latest.json is written once, by the updater-manifest job below.
          includeUpdaterJson: false

      # tauri build exits 0 even when signing fails, so a missing .sig would
      # otherwise publish a release that no installed copy can update to.
      - name: Verify this platform's update bundle was signed
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ matrix.label }}" in
            Windows) sigs=(src-tauri/target/release/bundle/nsis/*.sig) ;;
            macOS)   sigs=(src-tauri/target/release/bundle/macos/*.app.tar.gz.sig) ;;
            Linux)   sigs=(src-tauri/target/release/bundle/appimage/*.AppImage.sig) ;;
          esac
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "No updater .sig for ${{ matrix.label }} - refusing to publish an unupdatable release."
            ls -R src-tauri/target/release/bundle || true
            exit 1
          fi
          echo "Signed: ${sigs[*]}"

      # See scripts/fix-appimage.sh. Repacking changes the file, so its
      # updater signature has to be made again or every update would be refused.
      - name: Drop the bundled libwayland from the AppImage, then re-sign it
        if: matrix.label == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash scripts/fix-appimage.sh "$f"
            rm -f "$f.sig"
            npx tauri signer sign "$f"
            test -s "$f.sig"
          done

      # Replace what tauri-action uploaded with clearly named files (which OS
      # each one is for), plus the fixed AppImage and its new signature.
      # Windows keeps its own names.
      - name: Upload with clear names
        if: matrix.label != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          v="${VER#v}"
          b=src-tauri/target/release/bundle
          rid=${{ steps.tauri.outputs.releaseId }}
          api="repos/${{ github.repository }}/releases"
          if [ "${{ matrix.label }}" = macOS ]; then
            pattern='\.(dmg|app\.tar\.gz|app\.tar\.gz\.sig)$'
            files=(
              "$(ls $b/dmg/*.dmg | head -1)|Silent.Voice_${v}_macOS_Apple-Silicon.dmg"
              "$(ls $b/macos/*.app.tar.gz | head -1)|Silent.Voice_${v}_macOS_update.app.tar.gz"
              "$(ls $b/macos/*.app.tar.gz.sig | head -1)|Silent.Voice_${v}_macOS_update.app.tar.gz.sig"
            )
          else
            pattern='\.(AppImage|AppImage\.sig|deb|deb\.sig)$'
            files=(
              "$(ls $b/appimage/*.AppImage | head -1)|Silent.Voice_${v}_Linux_any-distro_x86_64.AppImage"
              "$(ls $b/appimage/*.AppImage.sig | head -1)|Silent.Voice_${v}_Linux_any-distro_x86_64.AppImage.sig"
              "$(ls $b/deb/*.deb | head -1)|Silent.Voice_${v}_Linux_Debian-Ubuntu_amd64.deb"
            )
            # .deb installs update through their own signed entry when built.
            if ls $b/deb/*.deb.sig >/dev/null 2>&1; then
              files+=("$(ls $b/deb/*.deb.sig | head -1)|Silent.Voice_${v}_Linux_Debian-Ubuntu_amd64.deb.sig")
            fi
          fi
          gh api "$api/$rid/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
          while read -r id name; do
            if [[ "$name" =~ $pattern ]]; then echo "removing $name"; gh api -X DELETE "$api/assets/$id"; fi
          done
          for pair in "${files[@]}"; do
            src="${pair%%|*}"; name="${pair##*|}"
            echo "uploading $src as $name"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" --data-binary @"$src" \
              "https://uploads.github.com/$api/$rid/assets?name=$name" >/dev/null
          done

  # One job writes latest.json for every platform, after all builds are done.
  # (Each build writing it would race, and the loser silently drops out of
  # the file: every user on that platform would never see another update.)
  updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write latest.json for Windows, macOS and Linux
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rid=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          gh api "repos/$REPO/releases/$rid/assets" --paginate > assets.json
          pick() { jq -r --arg p "$1" '.[] | select(.name|test($p)) | .'"$2" assets.json | head -1; }
          sig() {
            id=$(pick "$1" id)
            [ -n "$id" ] || { echo "missing signature matching $1" >&2; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id"
          }
          url() {
            n=$(pick "$1" name)
            [ -n "$n" ] || { echo "missing asset matching $1" >&2; exit 1; }
            echo "https://github.com/$REPO/releases/download/$TAG/$n"
          }
          jq -n \
            --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wu "$(url '_x64-setup\.exe$')"                   --arg ws "$(sig '_x64-setup\.exe\.sig$')" \
            --arg mu "$(url '_macOS_update\.app\.tar\.gz$')"         --arg ms "$(sig '_macOS_update\.app\.tar\.gz\.sig$')" \
            --arg lu "$(url '_Linux_any-distro_x86_64\.AppImage$')"  --arg ls "$(sig '_Linux_any-distro_x86_64\.AppImage\.sig$')" \
            '{version:$v, notes:"See the release page for details.", pub_date:$d, platforms:{
               "windows-x86_64":{url:$wu, signature:$ws},
               "darwin-aarch64":{url:$mu, signature:$ms},
               "linux-x86_64":{url:$lu, signature:$ls}}}' > latest.json
          # Without its own entry a .deb install would be handed the AppImage
          # and fail ("not a valid deb package"), so add it whenever it exists.
          if [ -n "$(pick '_Debian-Ubuntu_amd64\.deb\.sig$' id)" ]; then
            jq --arg u "$(url '_Debian-Ubuntu_amd64\.deb$')" --arg s "$(sig '_Debian-Ubuntu_amd64\.deb\.sig$')"               '.platforms["linux-x86_64-deb"]={url:$u, signature:$s}' latest.json > l.tmp && mv l.tmp latest.json
          fi
          cat latest.json
          old=$(pick '^latest\.json$' id)
          [ -z "$old" ] || gh api -X DELETE "repos/$REPO/releases/assets/$old"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.json "https://uploads.github.com/repos/$REPO/releases/$rid/assets?name=latest.json" >/dev/null
