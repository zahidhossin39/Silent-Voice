name: Linux distro smoke test

# Does the published AppImage actually start on distros other than the Ubuntu
# it was built on? Downloads a release's AppImage and launches it in clean
# containers. Fast (no build), so it runs on every change to itself or the
# smoke script, and can be pointed at any tag by hand.
on:
  # A published release is what users download, so test it as soon as it is
  # public. (Unreleased builds are covered by cross-platform-build.yml.)
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (default: latest)"
        required: false
  push:
    paths:
      - "scripts/smoke-linux.sh"
      - "packaging/arch/**"
      - ".github/workflows/linux-distro-smoke.yml"

jobs:
  smoke:
    # On a plain push this would only re-test the LAST release, which can't
    # change with the commit; the PKGBUILD job below still runs on push.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth mesa curl alsa-lib gtk3
          - distro: Fedora
            image: fedora:latest
            setup: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers curl which alsa-lib gtk3 libglvnd-gles && rm -fv /usr/lib64/libwayland-server.so* && ldconfig
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            setup: apt-get update && apt-get install -y xvfb xauth curl libgl1 libegl1 libasound2t64 libgtk-3-0t64 libgles2 libgbm1
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # ALSA and GTK3 (which pulls in fontconfig, X11, Mesa...) stand in for the
    # desktop every real user has: AppImages deliberately leave those system
    # libraries out so they match the host's sound, font and graphics stack.
    # Never add a library here just to make the app start: a hand-added
    # libwayland-server is what hid a real failure on Fedora X11 desktops.
    # Fedora deletes it instead, so the AppImage's fallback copy is tested.
    steps:
      - uses: actions/checkout@v4
      - name: Install a bare desktop-less base
        run: ${{ matrix.setup }}
      - name: Download the AppImage
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then path="tags/$TAG"; else path="latest"; fi
          url=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/$path" \
            | grep -o '"browser_download_url": *"[^"]*\.AppImage"' | cut -d'"' -f4 | head -1)
          echo "AppImage: $url"
          curl -fsSL -o app.AppImage "$url"
      - name: Launch it
        shell: bash
        run: env ${{ matrix.env || 'SMOKE=1' }} bash scripts/smoke-linux.sh app.AppImage

  # The Arch package (packaging/arch/PKGBUILD) built and installed for real.
  arch-pkgbuild:
    name: Arch PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Base tools
        run: pacman -Syu --noconfirm --needed base-devel xorg-server-xvfb xorg-xauth mesa sudo
      - name: makepkg -si (as a normal user, like a real install)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r packaging/arch /home/builder/pkg && chown -R builder /home/builder/pkg
          su builder -c 'cd ~/pkg && makepkg -si --noconfirm'
      - name: No Windows binaries installed
        run: |
          if find "/usr/lib/Silent Voice" -iname '*.dll' -o -iname '*.exe' | grep -q .; then
            echo "FAIL: Windows binaries in the Arch package"; exit 1; fi
      - name: Launch it
        run: su builder -c "cd ~ && bash '$GITHUB_WORKSPACE/scripts/smoke-linux.sh' /usr/bin/silent-voice"
