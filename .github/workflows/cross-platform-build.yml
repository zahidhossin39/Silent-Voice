name: Cross-platform build

# Produces an installable .dmg / .AppImage / .deb. Slower than the cargo-check
# gate in cross-platform.yml, because it builds whisper.cpp from source on macOS.
on:
  workflow_dispatch:
  # Also on changes to the packaging itself — that is exactly when the slow
  # path is worth paying for, and it needs no manual trigger.
  push:
    paths:
      - "scripts/fetch-sidecars.sh"
      - "src-tauri/tauri.macos.conf.json"
      - "src-tauri/tauri.linux.conf.json"
      - ".github/workflows/cross-platform-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2 libxdo-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Fetch sidecars
        run: bash scripts/fetch-sidecars.sh

      - name: Build the app
        id: build
        shell: bash
        env:
          # linuxdeploy strips every binary it deploys and chokes on the
          # whisper and sherpa libraries shipped alongside the app.
          NO_STRIP: "true"
          # linuxdeploy resolves each bundled binary's dependencies against the
          # normal library path, where none of our sidecars live. Every sidecar
          # directory has to be listed or it fails on the first missing .so.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sidecars:${{ github.workspace }}/src-tauri/sidecars/piper:${{ github.workspace }}/src-tauri/sidecars/llama:${{ github.workspace }}/src-tauri/sidecars/sherpa
        run: |
          set +e
          npx tauri build --verbose 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Collect and upload before deciding the job failed: a .deb is still
      # worth having when only the AppImage bundler falls over.
      - name: Collect the installers
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-voice-${{ matrix.label }}
          path: out/*
          if-no-files-found: warn

      # Packaging green only proves it links. This proves it BOOTS: install the
      # real artifact, launch it, and require the startup line in its own log.
      - name: Smoke test — does it actually start
        if: steps.build.outputs.code == '0'
        shell: bash
        run: |
          set -x
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y ./out/*.deb
            BIN=$(ls /usr/bin/silent-voice* /usr/bin/Silent* 2>/dev/null | head -1)
            LOGDIR="$HOME/.config/SilentVoice/logs"
            rm -rf "$HOME/.config/SilentVoice"
            xvfb-run -a --server-args="-screen 0 1280x800x24" "$BIN" > app.log 2>&1 &
          else
            APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
            BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)
            LOGDIR="$HOME/Library/Application Support/SilentVoice/logs"
            rm -rf "$HOME/Library/Application Support/SilentVoice"
            "$BIN" > app.log 2>&1 &
          fi
          PID=$!
          sleep 30

          echo "--- stdout/stderr ---"; cat app.log || true
          echo "--- app log ---"; cat "$LOGDIR/silent-voice.log" 2>/dev/null || echo "(no log file)"

          if ! kill -0 $PID 2>/dev/null; then
            echo "FAIL: the app exited within 30s of launch"
            exit 1
          fi
          kill $PID 2>/dev/null || true

          if ! grep -q "Silent Voice starting" "$LOGDIR/silent-voice.log" 2>/dev/null; then
            echo "FAIL: process stayed up but never reached its own startup log line"
            exit 1
          fi
          echo "PASS: ${{ matrix.label }} launches and reaches startup"

      - name: Post the build failure where it can be read
        if: steps.build.outputs.code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ${{ matrix.label }} build failed (exit ${{ steps.build.outputs.code }})"
            echo ""
            echo '```'
            tail -80 build.log
            echo '```'
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)"
          exit ${{ steps.build.outputs.code }}
