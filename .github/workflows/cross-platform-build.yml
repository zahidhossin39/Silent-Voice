name: Cross-platform build

# Produces an installable .dmg / .AppImage / .deb. Slower than the cargo-check
# gate in cross-platform.yml, because it builds whisper.cpp from source on macOS.
on:
  workflow_dispatch:
  # Also on changes to the packaging itself — that is exactly when the slow
  # path is worth paying for, and it needs no manual trigger.
  push:
    paths:
      - "scripts/fetch-sidecars.sh"
      - "scripts/smoke-test.sh"
      # Inline proofreading links glib/gobject and creates windows at startup;
      # only a full build and launch proves either still works.
      - "src-tauri/src/system/atspi.rs"
      - "src-tauri/src/system/ax.rs"
      - "src-tauri/src/system/inline_unix.rs"
      - "src-tauri/src/system/squiggle_overlay.rs"
      - "src-tauri/tauri.macos.conf.json"
      - "src-tauri/tauri.linux.conf.json"
      - ".github/workflows/cross-platform-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2 libxdo-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Cache the fetched sidecars
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/sidecars
          key: sidecars-${{ runner.os }}-${{ hashFiles('scripts/fetch-sidecars.sh') }}

      - name: Fetch sidecars
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-sidecars.sh

      - name: Build the app
        id: build
        shell: bash
        env:
          # linuxdeploy strips every binary it deploys and chokes on the
          # whisper and sherpa libraries shipped alongside the app.
          NO_STRIP: "true"
          # Updater artifacts are enabled for these platforms, and tauri build
          # hard-fails without the key. Passing it here also proves the release
          # workflow will produce signed bundles, without pushing a tag first.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy resolves each bundled binary's dependencies against the
          # normal library path, where none of our sidecars live. Every sidecar
          # directory has to be listed or it fails on the first missing .so.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sidecars:${{ github.workspace }}/src-tauri/sidecars/piper:${{ github.workspace }}/src-tauri/sidecars/llama:${{ github.workspace }}/src-tauri/sidecars/sherpa
        run: |
          set +e
          npx tauri build --verbose 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Collect and upload before deciding the job failed: a .deb is still
      # worth having when only the AppImage bundler falls over.
      - name: Collect the installers
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-voice-${{ matrix.label }}
          path: out/*
          if-no-files-found: warn

      # Updater artifacts are Windows-only for now, so there is nothing to sign
      # here; kept as a guard in case that changes.
      - name: Every bundle must be signed
        if: false
        shell: bash
        run: |
          found=$(find src-tauri/target/release/bundle -name '*.sig')
          if [ -z "$found" ]; then
            echo "No .sig produced - a release built this way could never be updated."
            find src-tauri/target/release/bundle -maxdepth 2 || true
            exit 1
          fi
          echo "signed:"; echo "$found"

      - name: Smoke test - does it actually start
        id: smoke
        if: steps.build.outputs.code == '0'
        shell: bash
        run: |
          set +e
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> $GITHUB_OUTPUT
          exit $CODE

      - name: Post the failure where it can be read
        if: always() && (steps.build.outputs.code != '0' || steps.smoke.outputs.code != '0')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            if [ "${{ steps.build.outputs.code }}" != "0" ]; then
              echo "### ${{ matrix.label }} build failed (exit ${{ steps.build.outputs.code }})"
              echo ""
              echo '```'
              tail -80 build.log
              echo '```'
            else
              echo "### ${{ matrix.label }} smoke test failed (exit ${{ steps.smoke.outputs.code }})"
              echo ""
              echo '```'
              tail -90 smoke.log
              echo '```'
            fi
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)"
          exit 1
