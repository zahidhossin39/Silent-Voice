name: Cross-platform build

# Produces an installable .dmg / .AppImage / .deb. Slower than the cargo-check
# gate in cross-platform.yml, because it builds whisper.cpp from source on macOS.
on:
  workflow_dispatch:
  # Also on changes to the packaging itself — that is exactly when the slow
  # path is worth paying for, and it needs no manual trigger.
  push:
    paths:
      - "scripts/fetch-sidecars.sh"
      - "src-tauri/tauri.macos.conf.json"
      - "src-tauri/tauri.linux.conf.json"
      - ".github/workflows/cross-platform-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2 libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Fetch sidecars
        run: bash scripts/fetch-sidecars.sh

      - name: Build the app
        id: build
        shell: bash
        env:
          # linuxdeploy strips every binary it deploys and chokes on the
          # whisper and sherpa libraries shipped alongside the app.
          NO_STRIP: "true"
          # The whisper-cpp sidecar lands in usr/bin while libwhisper.so.1 goes
          # to the resource dir, so linuxdeploy cannot resolve it on its own.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sidecars
        run: |
          set +e
          npx tauri build --verbose 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Collect and upload before deciding the job failed: a .deb is still
      # worth having when only the AppImage bundler falls over.
      - name: Collect the installers
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-voice-${{ matrix.label }}
          path: out/*
          if-no-files-found: warn

      - name: Post the build failure where it can be read
        if: steps.build.outputs.code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ${{ matrix.label }} build failed (exit ${{ steps.build.outputs.code }})"
            echo ""
            echo '```'
            tail -80 build.log
            echo '```'
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)"
          exit ${{ steps.build.outputs.code }}
