name: Cross-platform build

# Produces an installable .dmg / .AppImage / .deb. Slower than the cargo-check
# gate in cross-platform.yml, because it builds whisper.cpp from source on macOS.
on:
  workflow_dispatch:
  # Also on changes to the packaging itself — that is exactly when the slow
  # path is worth paying for, and it needs no manual trigger.
  push:
    paths:
      - "scripts/fetch-sidecars.sh"
      - "scripts/smoke-test.sh"
      - "scripts/smoke-linux.sh"
      - "scripts/fix-appimage.sh"
      - "scripts/macos-signing.sh"
      # Inline proofreading links glib/gobject and creates windows at startup;
      # only a full build and launch proves either still works.
      - "src-tauri/src/system/atspi.rs"
      - "src-tauri/src/system/ax.rs"
      - "src-tauri/src/system/inline_unix.rs"
      - "src-tauri/src/system/squiggle_overlay.rs"
      - "src-tauri/tauri.macos.conf.json"
      - "src-tauri/tauri.linux.conf.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/cross-platform-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2 libxdo-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Cache the fetched sidecars
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/sidecars
          key: sidecars-${{ runner.os }}-${{ hashFiles('scripts/fetch-sidecars.sh') }}

      - name: Fetch sidecars
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-sidecars.sh

      # The Windows sidecars (.dll/.exe) are committed to the repo and the
      # resource globs copy whole folders, so without this every Linux and
      # macOS package carried ~75 MB of Windows binaries it can never run.
      - name: Drop Windows-only sidecars
        if: runner.os != 'Windows'
        shell: bash
        run: find src-tauri/sidecars -type f \( -iname '*.dll' -o -iname '*.exe' \) -print -delete

      # Same certificate every build, so macOS keeps the Accessibility grant
      # across updates. See scripts/macos-signing.sh.
      - name: Use the project's code-signing certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh setup

      - name: Build the app
        id: build
        shell: bash
        env:
          # linuxdeploy strips every binary it deploys and chokes on the
          # whisper and sherpa libraries shipped alongside the app.
          NO_STRIP: "true"
          # Updater artifacts are enabled for these platforms, and tauri build
          # hard-fails without the key. Passing it here also proves the release
          # workflow will produce signed bundles, without pushing a tag first.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy resolves each bundled binary's dependencies against the
          # normal library path, where none of our sidecars live. Every sidecar
          # directory has to be listed or it fails on the first missing .so.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sidecars:${{ github.workspace }}/src-tauri/sidecars/piper:${{ github.workspace }}/src-tauri/sidecars/llama:${{ github.workspace }}/src-tauri/sidecars/sherpa
        run: |
          set +e
          npx tauri build --verbose 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Collect and upload before deciding the job failed: a .deb is still
      # worth having when only the AppImage bundler falls over.
      # Same as the release job: repack, then re-sign (repacking breaks the
      # updater signature, and an unsigned AppImage can never be updated).
      - name: Make the bundled libwayland a host fallback in the AppImage, then re-sign it
        if: runner.os == 'Linux' && steps.build.outputs.code == '0'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash scripts/fix-appimage.sh "$f"
            rm -f "$f.sig"
            npx tauri signer sign "$f"
            test -s "$f.sig"
          done

      - name: Collect the installers
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' -o -name '*.app.tar.gz' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-voice-${{ matrix.label }}
          path: out/*
          if-no-files-found: warn

      # macOS and Linux now auto-update too, so each must produce its signed
      # update bundle (.app.tar.gz.sig / .AppImage.sig).
      - name: Every bundle must be signed
        if: steps.build.outputs.code == '0'
        shell: bash
        run: |
          found=$(find src-tauri/target/release/bundle -name '*.sig')
          if [ -z "$found" ]; then
            echo "No .sig produced - a release built this way could never be updated."
            find src-tauri/target/release/bundle -maxdepth 2 || true
            exit 1
          fi
          echo "signed:"; echo "$found"

      - name: Check the macOS app is signed with that certificate
        if: runner.os == 'macOS' && steps.build.outputs.code == '0'
        shell: bash
        run: bash scripts/macos-signing.sh verify "$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"

      - name: Smoke test - does it actually start
        id: smoke
        if: steps.build.outputs.code == '0'
        shell: bash
        run: |
          set +e
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> $GITHUB_OUTPUT
          exit $CODE

      # The .deb smoke test above never touched the AppImage, which is what
      # every non-Debian distro has to use.
      - name: Smoke test - the AppImage starts too
        if: runner.os == 'Linux' && steps.build.outputs.code == '0'
        shell: bash
        run: bash scripts/smoke-linux.sh out/*.AppImage

      - name: Post the failure where it can be read
        if: always() && (steps.build.outputs.code != '0' || steps.smoke.outputs.code != '0')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          {
            if [ "${{ steps.build.outputs.code }}" != "0" ]; then
              echo "### ${{ matrix.label }} build failed (exit ${{ steps.build.outputs.code }})"
              echo ""
              echo '```'
              tail -80 build.log
              echo '```'
            else
              echo "### ${{ matrix.label }} smoke test failed (exit ${{ steps.smoke.outputs.code }})"
              echo ""
              echo '```'
              tail -90 smoke.log
              echo '```'
            fi
          } > body.md
          # Commit comments are public and NOT masked like job logs: tauri's
          # verbose output prints the keychain and certificate passwords.
          sed -i.bak -E 's/(-[pPk]) [^ ]+/\1 <REDACTED>/g' body.md
          if [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && grep -qF "$APPLE_CERTIFICATE_PASSWORD" body.md; then
            echo "certificate password still in the log, not posting it"; exit 1
          fi
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)"
          exit 1

  # The AppImage just built (and fixed by scripts/fix-appimage.sh), launched on
  # the distros where the old one crashed with EGL_BAD_PARAMETER. Fedora runs
  # without libwayland-server, like its X11-only desktops, to prove the
  # AppImage falls back to its own copy. Never add a library to these setups
  # just to make the app start: that is how that gap was hidden before.
  distros:
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth mesa alsa-lib gtk3
          - distro: Fedora
            image: fedora:latest
            setup: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which alsa-lib gtk3 libglvnd-gles && rm -fv /usr/lib64/libwayland-server.so* && ldconfig
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            setup: apt-get update && apt-get install -y xvfb xauth libgl1 libegl1 libasound2t64 libgtk-3-0t64 libgles2 libgbm1
    name: AppImage on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
        with:
          name: silent-voice-Linux
          path: out
      - name: Launch it
        shell: bash
        run: bash scripts/smoke-linux.sh out/*.AppImage
