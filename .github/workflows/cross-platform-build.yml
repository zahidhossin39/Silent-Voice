name: Cross-platform build

# Produces an installable .dmg / .AppImage. Manual for now: the sidecar fetch
# builds whisper.cpp from source on macOS, so this is far slower than the
# cargo-check gate in cross-platform.yml.
on:
  workflow_dispatch:
  # Also on changes to the packaging itself — that is exactly when the slow
  # path is worth paying for, and it needs no manual trigger.
  push:
    paths:
      - "scripts/fetch-sidecars.sh"
      - "src-tauri/tauri.macos.conf.json"
      - "src-tauri/tauri.linux.conf.json"
      - ".github/workflows/cross-platform-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev pkg-config libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Fetch sidecars
        run: bash scripts/fetch-sidecars.sh

      - name: Build the app
        id: build
        shell: bash
        run: |
          set +e
          npx tauri build 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post the build failure where it can be read
        if: steps.build.outputs.code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ${{ matrix.label }} build failed (exit ${{ steps.build.outputs.code }})"
            echo ""
            echo '```'
            tail -60 build.log
            echo '```'
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments"             -f body="$(cat body.md)"
          exit ${{ steps.build.outputs.code }}

      - name: Collect the installers
        id: collect
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out
          if [ -z "$(ls -A out)" ]; then
            echo "tauri build produced no installer for ${{ matrix.label }}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: silent-voice-${{ matrix.label }}
          path: out/*
